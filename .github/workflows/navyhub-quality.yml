name: NAVYHUB Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - ".github/workflows/navyhub-quality.yml"
  push:
    branches:
      - main
      - feat/navyhub-operational-modules
    paths:
      - "src/**"
      - ".github/workflows/navyhub-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navyhub-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, dependency audit and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_check_only
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Next.js production build
        run: npm run build
